version: "3.8"

# docker-compose.live.yml — serve Neuroster straight from the (bind-mounted)
# source folder. No build and no image to maintain: node:20-alpine serves the
# files live, so a `git pull` on the source shows up on the next browser refresh.
#
# This file deliberately AVOIDS ${VAR} interpolation and a .env file, because some
# compose validators reject shell-style defaults with "the format ... is invalid".
# To serve on a different host port (if 8080 is busy), change ONLY the LEFT number
# in the ports mapping below — e.g. "8888:8080" — and browse that port. Leave the
# right number 8080.
services:
  neuroster:
    image: node:20-alpine
    container_name: neuroster
    working_dir: /app
    command: node server.js
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/app:ro          # the source folder, mounted read-only and served live
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
