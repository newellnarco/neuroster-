<!DOCTYPE html>
<!-- cutscene.html — animated hero dioramas for the marketing video.
     Each variant is a little canvas-painted world in the game's soft, rounded
     style (procedural — no assets), with the title staged over it:
       intro  · dawn meadow: sunrise, drifting seeds, a hamster peeking from its burrow
       build  · a town raising itself: buildings pop in, a windmill turns, dust puffs
       defend · storm watch: moonlit clouds, owl eyes in the dark, lightning, rain
       outro  · starlit night: warm windows, fireflies, a shooting star
     Opened by record.mjs with query params and screen-recorded:
       ?title=Neuroster&sub=A+hamster+colony+world-builder&variant=intro
     Pure canvas + CSS, no dependencies, deterministic per-variant seed. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neuroster — cutscene</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .titling {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    font-family: Georgia, 'Times New Roman', serif; pointer-events: none;
  }
  .eyebrow {
    font-size: 16px; font-weight: 700; letter-spacing: .42em; text-transform: uppercase;
    color: var(--accent); opacity: 0; animation: fadeup 1s .3s ease-out forwards;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 2px 14px rgba(0,0,0,.8);
  }
  h1 { display: flex; gap: .22em; margin-top: 14px; }
  h1 span {
    font-size: 88px; font-weight: 700; color: #f6ecd8; letter-spacing: .01em;
    text-shadow: 0 3px 8px rgba(0,0,0,.55), 0 10px 40px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(40px) rotate(2deg);
    animation: word .9s cubic-bezier(.2,1.25,.35,1) forwards;
  }
  h1 span:last-child { color: var(--accent); }
  .sub {
    margin-top: 22px; font-size: 30px; font-style: italic; color: #e8dcc2;
    text-shadow: 0 2px 10px rgba(0,0,0,.75);
    opacity: 0; animation: fadeup 1.1s ease-out forwards;
  }
  .rule {
    width: 0; height: 2px; margin-top: 20px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: grow 1.1s ease-out forwards;
  }
  @keyframes fadeup { from { opacity: 0; transform: translateY(24px); }
                      to   { opacity: 1; transform: translateY(0); } }
  @keyframes word   { to { opacity: 1; transform: translateY(0) rotate(0); } }
  @keyframes grow   { to { width: 380px; } }
</style>
</head>
<body>
<canvas id="scene" width="1280" height="720"></canvas>
<div class="titling">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <div class="rule" id="rule"></div>
  <div class="sub" id="sub"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const variant = q.get('variant') || 'intro';
const ACCENT = { intro: '#ffd27d', build: '#b7f28e', defend: '#ffab91', outro: '#cfc4ff' }[variant] || '#ffd27d';
document.documentElement.style.setProperty('--accent', ACCENT);
document.getElementById('eyebrow').textContent =
  q.get('eyebrow') || { intro: 'a colony sim', build: 'dig · haul · craft', defend: 'hold the line', outro: 'play it' }[variant] || '';
const words = (q.get('title') || 'Neuroster').split(' ');
const h1 = document.getElementById('title');
words.forEach((w, i) => {
  const s = document.createElement('span');
  s.textContent = w;
  s.style.animationDelay = (0.55 + i * 0.16) + 's';
  h1.appendChild(s);
});
const lastDelay = 0.55 + words.length * 0.16;
document.getElementById('rule').style.animationDelay = (lastDelay + .25) + 's';
const sub = document.getElementById('sub');
sub.textContent = q.get('sub') || '';
sub.style.animationDelay = (lastDelay + .45) + 's';

// ---------------------------------------------------------------------------
// Canvas diorama
const cv = document.getElementById('scene'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let seed = { intro: 11, build: 23, defend: 47, outro: 71 }[variant] || 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = Array.from({ length: 400 }, rnd);   // frozen random table
const TAU = Math.PI * 2;
const t0 = performance.now();

function rr(x, y, w, h, r) {                   // rounded rect path
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function hills(baseY, amp, color, phase, drift) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(-50, H);
  for (let x = -50; x <= W + 50; x += 8) {
    const y = baseY + Math.sin(x * 0.004 + phase + drift) * amp
                    + Math.sin(x * 0.011 + phase * 2.3) * amp * 0.4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 50, H); ctx.closePath(); ctx.fill();
}
function tree(x, y, s, trunk, leaf) {
  ctx.fillStyle = trunk; rr(x - 3 * s, y - 16 * s, 6 * s, 18 * s, 2 * s); ctx.fill();
  ctx.fillStyle = leaf;
  for (const [dx, dy, r] of [[0, -26, 13], [-9, -18, 10], [9, -18, 10], [0, -14, 11]]) {
    ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, 0, TAU); ctx.fill();
  }
}
function hamster(x, y, s, body, belly, T) {
  const blink = (Math.sin(T * 0.8) > 0.985);
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = body;                                   // ears
  ctx.beginPath(); ctx.arc(-16, -30, 8, 0, TAU); ctx.arc(16, -30, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 26, 0, 0, TAU); ctx.fill();   // body
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(0, 8, 18, 14, 0, 0, TAU); ctx.fill();   // belly
  ctx.beginPath(); ctx.arc(-16, -28, 4, 0, TAU); ctx.arc(16, -28, 4, 0, TAU); ctx.fill(); // inner ears
  ctx.fillStyle = '#2b1c10';                              // eyes
  if (blink) { ctx.fillRect(-13, -12, 8, 2); ctx.fillRect(5, -12, 8, 2); }
  else {
    ctx.beginPath(); ctx.arc(-9, -11, 3.4, 0, TAU); ctx.arc(9, -11, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-8, -12, 1.2, 0, TAU); ctx.arc(10, -12, 1.2, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#d98a66';                              // nose
  ctx.beginPath(); ctx.arc(0, -5, 2.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(43,28,16,.55)'; ctx.lineWidth = 1;  // whiskers
  for (const sx of [-1, 1]) for (const dy of [-6, -3]) {
    ctx.beginPath(); ctx.moveTo(sx * 6, -4); ctx.lineTo(sx * 24, dy); ctx.stroke();
  }
  ctx.restore();
}
function house(x, y, s, wall, roof, T, lit) {
  ctx.fillStyle = wall; rr(x - 22 * s, y - 26 * s, 44 * s, 26 * s, 4 * s); ctx.fill();
  ctx.fillStyle = roof;
  ctx.beginPath(); ctx.moveTo(x - 28 * s, y - 24 * s); ctx.lineTo(x, y - 46 * s);
  ctx.lineTo(x + 28 * s, y - 24 * s); ctx.closePath(); ctx.fill();
  const flick = lit ? 0.75 + 0.25 * Math.sin(T * 7 + x) : 0;
  ctx.fillStyle = lit ? `rgba(255,214,140,${flick})` : 'rgba(43,28,16,.7)';
  rr(x - 6 * s, y - 18 * s, 12 * s, 12 * s, 2 * s); ctx.fill();
}
function windmill(x, y, s, T) {
  ctx.fillStyle = '#8a6a48';
  ctx.beginPath(); ctx.moveTo(x - 14 * s, y); ctx.lineTo(x - 8 * s, y - 52 * s);
  ctx.lineTo(x + 8 * s, y - 52 * s); ctx.lineTo(x + 14 * s, y); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(x, y - 52 * s); ctx.rotate(T * 0.9);
  ctx.fillStyle = '#e8dcc2';
  for (let i = 0; i < 4; i++) { rr(-3 * s, 0, 6 * s, 34 * s, 3 * s); ctx.fill(); ctx.rotate(TAU / 4); }
  ctx.restore();
  ctx.fillStyle = '#5c4630';
  ctx.beginPath(); ctx.arc(x, y - 52 * s, 4 * s, 0, TAU); ctx.fill();
}
function mound(x, y, s, dirt, dark) {
  ctx.fillStyle = dirt;
  ctx.beginPath(); ctx.ellipse(x, y, 46 * s, 22 * s, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(x, y - 2 * s, 20 * s, 12 * s, 0, Math.PI, 0); ctx.fill();
}
const sky = (stops) => {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  for (const [o, c] of stops) g.addColorStop(o, c);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
};

// --- variant scenes --------------------------------------------------------
function drawIntro(T) {
  const rise = Math.min(1, T / 6);                       // sun climbs over the card
  sky([[0, '#2c2140'], [0.45, `rgba(196,110,61,${0.55 + rise * 0.3})`], [1, '#f0b45e']]);
  const sx = W * 0.72, sy = H * 0.62 - rise * 170;
  const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 260);
  glow.addColorStop(0, 'rgba(255,214,140,.9)'); glow.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe9b8';
  ctx.beginPath(); ctx.arc(sx, sy, 46, 0, TAU); ctx.fill();
  hills(H * 0.66, 26, '#7a5a3a', 1.7, T * 0.010);
  hills(H * 0.76, 34, '#8c6a42', 4.1, T * 0.018);
  hills(H * 0.88, 30, '#a07a4c', 0.6, T * 0.028);
  for (let i = 0; i < 7; i++)
    tree(80 + i * 190 + R[i] * 60, H * (0.70 + R[i + 9] * 0.16), 0.8 + R[i + 20] * 0.7, '#5c4630', '#4c6b35');
  mound(W * 0.30, H * 0.93, 1.5, '#6b4c2e', '#241505');
  const peek = Math.max(0, Math.min(1, (T - 1.2) / 1.4));  // hamster pops up
  hamster(W * 0.30, H * 0.93 - 8 - peek * 26, 1.25, '#d9a05e', '#f2dbb8', T);
  ctx.fillStyle = 'rgba(255,246,220,.8)';                  // drifting seeds
  for (let i = 0; i < 26; i++) {
    const x = ((R[i + 40] * W + T * (12 + R[i + 66] * 22)) % (W + 60)) - 30;
    const y = H * R[i + 90] * 0.8 + Math.sin(T * 0.9 + i) * 16;
    ctx.beginPath(); ctx.arc(x, y, 1.6 + R[i + 120] * 1.6, 0, TAU); ctx.fill();
  }
}
function drawBuild(T) {
  sky([[0, '#8fc4e8'], [0.7, '#cfe6d8'], [1, '#e8e0b8']]);
  ctx.fillStyle = 'rgba(255,255,255,.85)';                 // drifting clouds
  for (let i = 0; i < 4; i++) {
    const x = ((R[i] * W + T * (14 + i * 5)) % (W + 260)) - 130, y = 60 + R[i + 5] * 130;
    for (const [dx, dy, r] of [[0, 0, 34], [30, 6, 26], [-32, 8, 24], [4, -14, 24]]) {
      ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, TAU); ctx.fill();
    }
  }
  hills(H * 0.62, 24, '#79a052', 2.2, T * 0.012);
  hills(H * 0.74, 30, '#8fb45e', 5.0, T * 0.02);
  hills(H * 0.88, 26, '#a3c46c', 0.9, T * 0.03);
  windmill(W * 0.82, H * 0.70, 1.15, T);
  // Buildings pop in one by one, each with a little squash-and-settle + dust.
  const spots = [[0.16, 0.86, 1.1], [0.33, 0.90, 1.3], [0.50, 0.84, 1.0], [0.64, 0.92, 1.4], [0.26, 0.97, 1.2], [0.55, 0.99, 1.15]];
  spots.forEach(([fx, fy, s], i) => {
    const born = 0.7 + i * 0.8, k = Math.max(0, Math.min(1, (T - born) / 0.45));
    if (k <= 0) return;
    const pop = 1 + Math.sin(Math.min(1, k) * Math.PI) * 0.22;
    house(W * fx, H * fy, s * pop * (0.6 + 0.4 * k), '#c8a06a', '#8a4f34', T, k >= 1);
    if (k < 1) {                                           // dust puffs
      ctx.fillStyle = `rgba(190,160,110,${(1 - k) * 0.6})`;
      for (let d = 0; d < 5; d++) {
        ctx.beginPath();
        ctx.arc(W * fx + (R[i * 7 + d] - .5) * 90 * k, H * fy - 6 - k * 26, 7 + d * 3 * k, 0, TAU);
        ctx.fill();
      }
    }
  });
  const hx = ((T * 65) % (W + 260)) - 130;                 // hauler crossing with a plank
  hamster(hx, H * 0.955, 1.05, '#b98a55', '#ecd6b0', T);
  ctx.fillStyle = '#8a6a48'; rr(hx + 18, H * 0.955 - 46, 52, 9, 3); ctx.fill();
}
function drawDefend(T) {
  sky([[0, '#0b0d1e'], [0.6, '#171a30'], [1, '#25182a']]);
  const flash = Math.max(0, Math.sin(T * 0.7) - 0.965) * 28;   // occasional lightning
  const mx = W * 0.22, my = H * 0.22;
  const mg = ctx.createRadialGradient(mx, my, 8, mx, my, 140);
  mg.addColorStop(0, 'rgba(220,225,255,.5)'); mg.addColorStop(1, 'rgba(220,225,255,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e8ecff';
  ctx.beginPath(); ctx.arc(mx, my, 38, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9cfec';
  for (const [dx, dy, r] of [[-10, -6, 7], [12, 8, 5], [4, -14, 4]]) {
    ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(16,18,38,.75)';                    // scudding lumpy clouds
  for (let i = 0; i < 5; i++) {
    const x = ((R[i] * W + T * (30 + i * 12)) % (W + 300)) - 150, y = 40 + R[i + 8] * 150;
    for (const [dx, dy, rx, ry] of [[0, 0, 120, 24], [70, 8, 70, 17], [-80, 10, 60, 15], [10, -14, 70, 16]]) {
      ctx.beginPath(); ctx.ellipse(x + dx, y + dy, rx, ry, 0, 0, TAU); ctx.fill();
    }
  }
  if (flash > 0) { ctx.fillStyle = `rgba(235,240,255,${Math.min(.75, flash)})`; ctx.fillRect(0, 0, W, H); }
  hills(H * 0.60, 30, '#131022', 2.8, 0);
  for (let i = 0; i < 9; i++)                              // black forest
    tree(40 + i * 150 + R[i + 30] * 50, H * (0.70 + R[i + 44] * 0.14), 1.6 + R[i + 60] * 1.2, '#0c0a16', '#100d20');
  hills(H * 0.86, 26, '#0a0814', 1.1, 0);
  // Owl eyes blinking deep in the treeline.
  for (const [fx, fy, ph] of [[0.62, 0.66, 0], [0.87, 0.60, 2.1]]) {
    const open = (Math.sin(T * 0.9 + ph) > -0.88);
    if (open) {
      ctx.fillStyle = '#ffd76e';
      for (const s of [-9, 9]) { ctx.beginPath(); ctx.arc(W * fx + s, H * fy, 5, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#241a05';
      for (const s of [-9, 9]) { ctx.beginPath(); ctx.arc(W * fx + s, H * fy, 2, 0, TAU); ctx.fill(); }
    }
  }
  // Watchtower with a swaying lantern; a guard hamster on duty.
  const tx = W * 0.13, ty = H * 0.90;
  ctx.fillStyle = '#241a10';
  rr(tx - 16, ty - 90, 32, 90, 4); ctx.fill();
  rr(tx - 26, ty - 104, 52, 18, 4); ctx.fill();
  const lx = tx + 30 + Math.sin(T * 1.6) * 5;
  ctx.strokeStyle = '#3a2c1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx + 24, ty - 100); ctx.lineTo(lx, ty - 86); ctx.stroke();
  const lg = ctx.createRadialGradient(lx, ty - 82, 2, lx, ty - 82, 60);
  lg.addColorStop(0, 'rgba(255,200,110,.95)'); lg.addColorStop(1, 'rgba(255,200,110,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ty - 82, 60, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffca6e'; rr(lx - 4, ty - 90, 8, 12, 2); ctx.fill();
  hamster(tx, ty - 118, 0.85, '#b98a55', '#ecd6b0', T);
  ctx.strokeStyle = 'rgba(160,180,230,.35)'; ctx.lineWidth = 1.5;   // rain
  for (let i = 0; i < 70; i++) {
    const x = (R[i + 100] * W + T * 260 + i * 13) % W;
    const y = (R[i + 200] * H + T * 620) % H;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 7, y + 16); ctx.stroke();
  }
}
function drawOutro(T) {
  sky([[0, '#0d0a24'], [0.65, '#1c1436'], [1, '#31204a']]);
  for (let i = 0; i < 90; i++) {                            // twinkling stars
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(T * (0.6 + R[i] * 1.4) + i));
    ctx.fillStyle = `rgba(240,240,255,${tw})`;
    ctx.beginPath(); ctx.arc(R[i + 40] * W, R[i + 140] * H * 0.62, R[i + 240] * 1.6 + 0.4, 0, TAU); ctx.fill();
  }
  const shoot = (T % 7) / 7;                                // a shooting star every 7s
  if (shoot < 0.14) {
    const k = shoot / 0.14, x = W * (0.85 - k * 0.5), y = H * (0.08 + k * 0.24);
    const g = ctx.createLinearGradient(x, y, x + 120, y - 56);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 120, y - 56); ctx.stroke();
  }
  const mx = W * 0.80, my = H * 0.20;
  const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 200);
  mg.addColorStop(0, 'rgba(250,240,210,.7)'); mg.addColorStop(1, 'rgba(250,240,210,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f7ecd2'; ctx.beginPath(); ctx.arc(mx, my, 42, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ddd2b8';
  for (const [dx, dy, r] of [[-12, -8, 8], [10, 10, 6], [8, -12, 4]]) {
    ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, TAU); ctx.fill();
  }
  hills(H * 0.64, 26, '#1a1230', 2.0, 0);
  hills(H * 0.78, 30, '#241940', 4.6, 0);
  // Sleeping town: silhouettes with warm, flickering windows.
  for (const [fx, fy, s] of [[0.18, 0.86, 1.1], [0.34, 0.90, 1.35], [0.52, 0.85, 1.0], [0.68, 0.92, 1.3], [0.44, 0.97, 1.2]])
    house(W * fx, H * fy, s, '#332457', '#1e1538', T, true);
  windmill(W * 0.88, H * 0.76, 1.0, T * 0.35);
  hills(H * 0.96, 18, '#130c26', 1.2, 0);
  hamster(W * 0.09, H * 0.885, 1.15, '#3a2b55', '#4d3a6e', T);  // stargazer silhouette
  for (let i = 0; i < 16; i++) {                            // fireflies
    const x = W * (0.1 + R[i + 50] * 0.8) + Math.sin(T * (0.5 + R[i] * 0.8) + i * 2) * 40;
    const y = H * (0.62 + R[i + 70] * 0.32) + Math.cos(T * (0.4 + R[i + 90] * 0.6) + i) * 24;
    const a = 0.25 + 0.75 * Math.abs(Math.sin(T * 1.4 + i * 1.7));
    const fg = ctx.createRadialGradient(x, y, 0, x, y, 9);
    fg.addColorStop(0, `rgba(220,255,140,${a})`); fg.addColorStop(1, 'rgba(220,255,140,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
  }
}

const SCENES = { intro: drawIntro, build: drawBuild, defend: drawDefend, outro: drawOutro };
const draw = SCENES[variant] || drawIntro;
(function frame(now) {
  const T = (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  draw(T);
  // soft vignette keeps the type readable over any scene
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})(t0);
</script>
</body>
</html>
