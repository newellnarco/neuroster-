<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuroster — Hamster Colony</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🐹 <b>Neuroster</b></div>
    <div id="resbar" class="resbar"></div>
    <div class="spacer"></div>
    <div class="controls">
      <button id="btn-save" title="Save now">💾 Save</button>
      <button id="btn-new" title="New colony">🆕 New</button>
    </div>
  </header>

  <div id="envbar" class="envbar"></div>
  <div id="needsbar" class="needsbar"></div>

  <main id="stage">
    <div id="board">
      <canvas id="game"></canvas>
      <div id="flash" class="flash"></div>
      <div class="hotkeys">Space = pause · 1/2/3 = speed · Click building to place · Right-click cancels · Click a structure to demolish</div>
    </div>

    <aside id="sidebar">
      <nav class="tabs">
        <button class="tabbtn active" data-tab="build">🏗️ Build</button>
        <button class="tabbtn" data-tab="tech">🔬 Skills</button>
        <button class="tabbtn" data-tab="evo">🧬 Evolve</button>
        <button class="tabbtn" data-tab="rodents">🐹 Rodents</button>
        <button class="tabbtn" data-tab="threats">🛡️ Threats</button>
      </nav>
      <div class="panes">
        <section id="tab-build" class="tabpane active"></section>
        <section id="tab-tech" class="tabpane"></section>
        <section id="tab-evo" class="tabpane"></section>
        <section id="tab-rodents" class="tabpane"></section>
        <section id="tab-threats" class="tabpane"></section>
      </div>
      <div id="log" class="log"></div>
    </aside>
  </main>

  <div id="biome-modal" class="modal hidden">
    <div class="modal-card">
      <h2>🐹 Start a New Colony</h2>
      <p>Choose a biome — each map has its own resources, benefits and challenges.</p>
      <div id="biome-grid" class="grid"></div>
      <button id="biome-cancel" class="modal-cancel">Cancel</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
